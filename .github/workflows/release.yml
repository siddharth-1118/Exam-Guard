# ExamGuard Desktop Release Pipeline (Phase 6 & 19)
# Triggers on git tags matching v* (e.g. v0.3.0)
# Builds Windows NSIS installer, macOS DMG, and Linux AppImage via electron-builder

name: Desktop Release

on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '20'

jobs:
  build-and-release:
    name: Build Desktop Artifact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win
            artifact: ExamGuard Setup *.exe
          - os: macos-latest
            target: mac
            artifact: ExamGuard-*.dmg
          - os: ubuntu-latest
            target: linux
            artifact: ExamGuard-*.AppImage

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: |
          pnpm --filter @examguard/types build
          pnpm --filter @examguard/config build
          pnpm --filter @examguard/auth build
          pnpm --filter @examguard/security build

      - name: Build Electron App (${{ matrix.target }})
        run: pnpm --filter @examguard/student-desktop build:${{ matrix.target }}

      - name: Create GitHub Release & Upload Artifact
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: apps/student-desktop/dist/installer/${{ matrix.artifact }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
