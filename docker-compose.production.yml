# ExamGuard — Production Docker Compose Topology
# Usage: docker compose -f docker-compose.production.yml up -d
# Note: Requires a valid .env file populated with production credentials.

services:
  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16-alpine
    container_name: examguard-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-examguard}
      POSTGRES_USER: ${POSTGRES_USER:-examguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ---- Redis Cache & Presence ----
  redis:
    image: redis:7-alpine
    container_name: examguard-redis-prod
    command: redis-server --requirepass "${REDIS_PASSWORD:-}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ---- Database Migration Job ----
  migration:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: examguard-migration-prod
    command: npx prisma migrate deploy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---- Core API Service ----
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: examguard-api-prod
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SFU_URL: ${SFU_URL}
      SFU_ADMIN_KEY: ${SFU_ADMIN_KEY}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      RECORDING_STORAGE_DIR: ${RECORDING_STORAGE_DIR:-/app/storage/recordings}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      API_PORT: "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: always

  # ---- Media / SFU Service ----
  media:
    build:
      context: .
      dockerfile: services/media/Dockerfile
    container_name: examguard-media-prod
    ports:
      - "${SFU_PORT:-4010}:4010"
      - "${SFU_RTC_MIN_PORT:-40000}-${SFU_RTC_MAX_PORT:-49999}:${SFU_RTC_MIN_PORT:-40000}-${SFU_RTC_MAX_PORT:-49999}/udp"
    environment:
      NODE_ENV: production
      SFU_PORT: "4010"
      SFU_HOST: "0.0.0.0"
      JWT_SECRET: ${JWT_SECRET}
      SFU_ADMIN_KEY: ${SFU_ADMIN_KEY}
      SFU_RTC_MIN_PORT: ${SFU_RTC_MIN_PORT:-40000}
      SFU_RTC_MAX_PORT: ${SFU_RTC_MAX_PORT:-49999}
      SFU_ANNOUNCED_IP: ${SFU_ANNOUNCED_IP:-}
      RECORDING_STORAGE_DIR: ${RECORDING_STORAGE_DIR:-/app/storage/recordings}
      API_URL: ${INTERNAL_API_URL:-http://api:4000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4010/status"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: always

volumes:
  postgres_prod_data:
    driver: local
