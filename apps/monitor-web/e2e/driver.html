<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ExamGuard monitor E2E driver</title>
    <style>
      body { background: #0b1220; color: #94a3b8; font-family: ui-monospace, monospace; margin: 0; }
      #wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; }
      video, audio { width: 100%; background: #000; border: 1px solid #1e293b; }
      .tag { font-size: 10px; color: #475569; padding: 2px 4px; }
    </style>
  </head>
  <body>
    <div class="tag" id="status">starting…</div>
    <div id="wrap">
      <div><div class="tag">camera</div><video id="camera" muted autoplay playsinline></video></div>
      <div><div class="tag">screen</div><video id="screen" muted autoplay playsinline></video></div>
    </div>
    <div class="tag">microphone</div>
    <audio id="mic" autoplay playsinline muted></audio>
    <script src="./driver.bundle.js"></script>
  </body>
</html>
