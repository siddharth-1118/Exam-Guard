# ExamGuard local development environment.
# Only services that exist are included; Phase 4+ services (minio, livekit, ai)
# will be added behind compose profiles when implemented — nothing fake is started.
services:
  postgres:
    image: postgres:16-alpine
    container_name: examguard-postgres
    environment:
      POSTGRES_USER: examguard
      POSTGRES_PASSWORD: examguard
      POSTGRES_DB: examguard
    ports:
      - "5432:5432"
    volumes:
      - examguard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examguard -d examguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: examguard-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  examguard-pgdata: